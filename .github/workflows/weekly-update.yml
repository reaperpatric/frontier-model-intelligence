name: Weekly Frontier Data Update

on:
  schedule:
    # 每周一 09:00（北京时间）= 01:00 UTC
    - cron: '0 1 * * 1'
  workflow_dispatch:   # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install cryptography

      - name: Fetch latest data
        run: python aa_frontier_fetch.py

      - name: Analyze iteration cadence
        run: python analyze_cadence.py

      - name: Build dashboard
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 周更前沿数据 $(date -u +%Y-%m-%d)"
            git push
          fi
